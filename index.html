<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visionary | Daily Tasks Preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9eee6;color:#20342a;font:16px system-ui,sans-serif}main{max-width:640px;margin:auto;min-height:100vh;padding:20px 16px 92px;background:#f7f8f3}header,.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}header{font-size:13px;font-weight:800;letter-spacing:.1em}.avatar,.pill{background:#dce8d5;border-radius:99px;padding:6px 10px}.demo{font-size:12px;color:#596a5f}h1{margin:16px 0}h2{font-size:19px;margin:20px 0 8px}p{margin:6px 0}.card,details{background:white;border:1px solid #d6dfd3;border-radius:14px;margin:8px 0;padding:13px}progress{width:100%;accent-color:#467355;margin-top:10px}button{font:inherit;color:inherit;background:white;border:1px solid #ccd8cc;border-radius:10px;padding:9px;min-height:44px;cursor:pointer}button[aria-pressed=true]{background:#315843;color:white}small{color:#57695d}.filters{display:flex;gap:6px;margin:16px 0}.filters button{flex:1;padding:6px;font-size:14px}.due{display:flex;width:100%;text-align:left;align-items:center;gap:10px;border:0;border-radius:0;border-bottom:1px solid #e3e9e0}.due:last-child{border-bottom:0}.late{color:#8c382e;background:#f8e4df}.due span:last-child{margin-left:auto}summary{cursor:pointer;font-weight:750;min-height:32px}summary small{float:right}.task{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #edf0eb;scroll-margin:20px}.task input{width:21px;height:21px;accent-color:#467355}.task:focus-within{background:#eef5e9}.review{width:100%;margin-top:10px;font-weight:750}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,640px);background:white;border-top:1px solid #d6dfd3;display:flex;justify-content:space-around;padding:10px 4px max(10px,env(safe-area-inset-bottom));font-size:11px;text-align:center}nav span{padding:6px}nav b{display:block;font-size:19px}nav [aria-current]{background:#e5efdf;border-radius:10px}dialog{border:1px solid #d6dfd3;border-radius:16px;width:min(90vw,460px);color:inherit}dialog::backdrop{background:#182f2466}
</style>
<main><header><span>VISIONARY TOOL</span><span class="avatar">VT</span></header><h1>Daily Tasks</h1><p class="demo">Interactive preview · Sample shift · 9:35 PM</p>
<section class="card"><div class="spread"><div><strong>B2 · Nov 6</strong> <small class="pill">Synced</small><p id="progressLabel"></p></div><button id="setup">Shift setup ›</button></div><progress id="progress" aria-label="Shift completion"></progress></section>
<h2>Due Next</h2><section class="card" id="due"></section><div class="filters" id="filters"></div><section id="tasks" aria-label="Checklist"></section><button class="review" id="review">Review Shift</button></main>
<nav aria-label="Preview navigation"><span><b>⌂</b>Home</span><span aria-current="page"><b>☑</b>Daily Tasks</span><span><b>▤</b>Copy/Paste</span><span><b>▧</b>Logs</span><span><b>•••</b>More</span></nav>
<dialog id="panel"><div class="spread"><strong id="panelTitle"></strong><form method="dialog"><button>Close</button></form></div><div id="panelBody"></div></dialog>
<script>
const list=[
 ['LNS IQ Checks','Allocation 1 · Line 3','Jeremy',true],
 ['LNS IQ Checks','Allocation 2 · Line 4','Jessica',false,'9:00 PM','35 min late'],
 ['LNS IQ Checks','Allocation 3 · Line 5','Jessica',true],
 ['PKG IQ Checks','Line 4 · PKG IQ','Jessica',true],
 ['PKG IQ Checks','Line 5 · PKG IQ','Jeremy',true],
 ['PKG DL Checks','Line 5 · PKG DL','Jeremy',false,'10:00 PM'],
 ['Error Proofing','Line 4 · Station A','Jessica',true],
 ['Error Proofing','Line 5 · Station B','Jessica',false]
];
const el=id=>document.getElementById(id);
let filter=0;
const openGroups=new Set(['LNS IQ Checks']);
const filters=['All Tasks','My Tasks','Incomplete'];
function jump(i){
 filter=0;openGroups.add(list[i][0]);render();
 const target=el('task'+i);target.focus({preventScroll:true});target.scrollIntoView({block:'center'});
}
function render(){
 const done=list.filter(t=>t[3]).length;
 el('progressLabel').textContent=done+' of '+list.length+' complete';
 el('progress').max=list.length;el('progress').value=done;
 const due=el('due');due.replaceChildren();
 list.forEach((t,i)=>{
  if(t[3]||!t[4])return;
  const b=document.createElement('button');b.className='due';
  b.innerHTML='<small class="pill '+(t[5]?'late':'')+'">'+(t[5]?'Overdue':t[4])+'</small><div><strong>'+t[0]+'</strong><br><small>'+t[1]+' · '+t[2]+(t[5]?'<br>Due '+t[4]+' · '+t[5]:'')+'</small></div><span>›</span>';
  b.onclick=()=>jump(i);due.append(b);
 });
 if(!due.children.length)due.textContent='No scheduled tasks remaining.';
 el('filters').replaceChildren();
 filters.forEach((name,i)=>{
  const b=document.createElement('button');b.textContent=name+' '+[list.length,list.filter(t=>t[2]==='Jessica').length,list.length-done][i];
  b.setAttribute('aria-pressed',String(filter===i));b.onclick=()=>{filter=i;render();el('filters').children[i].focus()};el('filters').append(b);
 });
 el('tasks').replaceChildren();
 for(const group of new Set(list.map(t=>t[0]))){
  const members=list.filter(t=>t[0]===group), visible=members.filter(t=>filter===0||(filter===1?t[2]==='Jessica':!t[3]));
  if(!visible.length)continue;
  const d=document.createElement('details');d.open=openGroups.has(group)||filter!==0;
  d.innerHTML='<summary>'+group+' <small>'+members.filter(t=>t[3]).length+' of '+members.length+'</small></summary>';
  d.ontoggle=()=>{if(!d.isConnected||filter!==0)return;if(d.open)openGroups.add(group);else openGroups.delete(group)};
  visible.forEach(t=>{
   const i=list.indexOf(t),label=document.createElement('label');label.className='task';
   label.innerHTML='<input type="checkbox" id="task'+i+'" '+(t[3]?'checked':'')+'><span>'+t[1]+'<br><small>'+t[2]+'</small></span>';
   label.firstChild.onchange=e=>{t[3]=e.target.checked;render();el('task'+i)?.focus({preventScroll:true})};d.append(label);
  });el('tasks').append(d);
 }
 if(!el('tasks').children.length)el('tasks').textContent='No tasks match this filter.';
}
function dialog(title){el('panelTitle').textContent=title;el('panelBody').replaceChildren();el('panel').showModal();return el('panelBody')}
el('setup').onclick=()=>{dialog('Shift setup').textContent='B2 · Nov 6 · Night shift. Sample roster: Jessica and Jeremy.'};
el('review').onclick=()=>{
 const body=dialog('Review Shift');const p=document.createElement('p');p.textContent='Synced · '+list.filter(t=>!t[3]).length+' incomplete';body.append(p);
 list.forEach((t,i)=>{if(t[3])return;const b=document.createElement('button');b.className='due';b.textContent=t[0]+' · '+t[1]+' · '+t[2];b.onclick=()=>{el('panel').close();jump(i)};body.append(b)});
};
render();
</script></html>
